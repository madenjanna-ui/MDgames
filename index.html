<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#041522">
  <title>MD Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="intro" class="intro" aria-label="MD Games">
    <img src="assets/md-games-intro.gif" alt="MD Games">
  </div>

  <main id="app" class="app is-hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">MD</span>
        <span class="brand-name">GAMES</span>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">MD GAMES</p>
      <h1>Игры, в которые<br>хочется погрузиться</h1>
      <p class="subtitle">Выбирай игру и отправляйся в приключение.</p>
    </section>

    <section class="games">
      <article class="game-card ocean">
        <div class="card-glow"></div>
        <div class="card-content">
          <span class="game-icon">🌊</span>
          <p class="game-label">ИГРА №1</p>
          <h2>Тайны океана</h2>
          <p>Исследуй глубины, находи тайны и открывай неизведанное.</p>
          <button id="playOcean" class="play-button" type="button">
            <span>Играть</span>
            <span class="arrow">→</span>
          </button>
        </div>
      </article>

      <article class="game-card coming-soon" aria-disabled="true">
        <div class="card-content">
          <span class="game-icon">✦</span>
          <p class="game-label">СКОРО</p>
          <h2>Новые игры</h2>
          <p>Здесь появятся следующие игры MD Games.</p>
        </div>
      </article>
    </section>
  </main>

  <section id="oceanScreen" class="game-screen is-hidden">
  <div class="ocean-wrap">
    <div class="ocean-head">
      <button id="backButton" class="back-button" type="button">← <span>MD Games</span></button>
      <div class="hud-mini"><span>СЧЁТ</span><b id="score">0</b><span>ВОДОЛАЗЫ</span><b id="divers">3</b></div>
    </div>

    <div class="ocean-board">
      <img class="scene-img" src="assets/ocean-scene-v4.png" alt="Тайны океана">
      <div id="routeLayer" class="route-layer" aria-hidden="true"><div id="bagSprite" class="bag-sprite">👜</div><div id="rewardFlash" class="reward-flash"><span>👜</span><span>👜</span><span>👜</span></div>
        <div id="diverSprite" class="diver-sprite">
      <div class="diver-helmet"><i></i></div>
      <div class="diver-tank"></div>
      <div class="diver-body"></div>
      <div class="diver-arm arm-a"></div>
      <div class="diver-arm arm-b"></div>
      <div class="diver-leg leg-a"></div>
      <div class="diver-leg leg-b"></div>
      <div class="diver-bag">👜</div>
    </div>
        <div id="dangerLayer"></div>
      </div>
      <div id="over" class="over is-hidden">
        <div id="overIcon">🐙</div>
        <h2 id="overTitle"></h2>
        <p id="overText"></p>
        <button id="restart" class="play-button" type="button">Играть снова ↻</button>
      </div>
    </div>

    <div class="controls">
      <button id="left" class="control-button" type="button" aria-label="Влево">◀</button>
      <span>ТОЛЬКО ДВЕ КЛАВИШИ</span>
      <button id="right" class="control-button" type="button" aria-label="Вправо">▶</button>
    </div>
  </div>
</section>

  <script src="app.js"></script>
</body>
</html>
